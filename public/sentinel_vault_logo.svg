<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Core Ambient Aura -->
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Electric Cyber Gradient -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Violet Sentinel Shield Gradient -->
    <linearGradient id="shieldViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Titanium Dark Armor Fill -->
    <linearGradient id="armorMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14192b" />
      <stop offset="50%" stop-color="#0d111e" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Inner Core Ultra Glow -->
    <linearGradient id="pupilGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Chrome Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Sentinel Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#coreAura)" />

  <!-- ==================== OUTER HEXAGONAL CYBER SHIELD ==================== -->
  <!-- Outer Armor Silhouette -->
  <polygon 
    points="256,22 462,139 462,373 256,490 50,373 50,139" 
    fill="url(#armorMetal)" 
    stroke="url(#rimGrad)" 
    stroke-width="4" 
    stroke-linejoin="round"
  />

  <!-- High-Tech Shield Accent Corners (Cyber Brackets) -->
  <!-- Top Apex Bracket -->
  <path d="M 230 40 L 256 25 L 282 40" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom Apex Bracket -->
  <path d="M 230 472 L 256 487 L 282 472" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <!-- Top Right Corner -->
  <path d="M 436 127 L 459 140 L 459 170" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom Right Corner -->
  <path d="M 459 342 L 459 372 L 436 385" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom Left Corner -->
  <path d="M 76 385 L 53 372 L 53 342" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <!-- Top Left Corner -->
  <path d="M 53 170 L 53 140 L 76 127" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />

  <!-- Inner Inset Shield Rim -->
  <polygon 
    points="256,48 438,151 438,361 256,464 74,361 74,151" 
    fill="none" 
    stroke="rgba(139, 92, 246, 0.35)" 
    stroke-width="1.5" 
    stroke-dasharray="8 6" 
    stroke-linejoin="round"
  />

  <!-- ==================== FUTURISTIC VAULT DOOR MECHANISM ==================== -->
  <!-- Heavy Outer Vault Gear Ring -->
  <circle cx="256" cy="256" r="168" fill="#090d18" stroke="url(#shieldViolet)" stroke-width="3" />
  <circle cx="256" cy="256" r="162" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" stroke-dasharray="3 5" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#1e2640" stroke-width="8" />

  <!-- 12 Vault Indexing Teeth / Rotary Lock Lugs -->
  <g fill="url(#cyberCyan)" opacity="0.85">
    <rect x="253" y="96" width="6" height="12" rx="1.5" />
    <rect x="253" y="404" width="6" height="12" rx="1.5" />
    <rect x="96" y="253" width="12" height="6" rx="1.5" />
    <rect x="404" y="253" width="12" height="6" rx="1.5" />
    <!-- 30 deg -->
    <rect x="330" y="127" width="6" height="12" rx="1.5" transform="rotate(30 333 133)" />
    <rect x="176" y="393" width="6" height="12" rx="1.5" transform="rotate(30 179 399)" />
    <!-- 60 deg -->
    <rect x="393" y="176" width="6" height="12" rx="1.5" transform="rotate(60 396 182)" />
    <rect x="127" y="330" width="6" height="12" rx="1.5" transform="rotate(60 130 336)" />
    <!-- 120 deg -->
    <rect x="393" y="330" width="6" height="12" rx="1.5" transform="rotate(120 396 336)" />
    <rect x="127" y="176" width="6" height="12" rx="1.5" transform="rotate(120 130 182)" />
    <!-- 150 deg -->
    <rect x="330" y="393" width="6" height="12" rx="1.5" transform="rotate(150 333 399)" />
    <rect x="176" y="127" width="6" height="12" rx="1.5" transform="rotate(150 179 133)" />
  </g>

  <!-- 6 Heavy Vault Hydraulic Locking Latches (Angled at 60 deg) -->
  <g stroke="url(#cyberCyan)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <!-- Top-Center Lock -->
    <path d="M 256 108 L 256 148" />
    <!-- Bottom-Center Lock -->
    <path d="M 256 364 L 256 404" />
    <!-- Top-Right Lock -->
    <path d="M 358 197 L 324 217" />
    <!-- Bottom-Right Lock -->
    <path d="M 358 315 L 324 295" />
    <!-- Bottom-Left Lock -->
    <path d="M 154 315 L 188 295" />
    <!-- Top-Left Lock -->
    <path d="M 154 197 L 188 217" />
  </g>

  <!-- Inner Vault Chamber (Hexagonal Bevel) -->
  <polygon 
    points="256,134 362,195 362,317 256,378 150,317 150,195" 
    fill="#060913" 
    stroke="url(#shieldViolet)" 
    stroke-width="3.5" 
    stroke-linejoin="round"
  />

  <!-- Secondary Internal Security Ring -->
  <circle cx="256" cy="256" r="102" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- ==================== THE SENTINEL EYE / CORE ==================== -->
  <!-- Outer Angular Sentinel Eye Visor (Hexagonal Silhouette) -->
  <polygon 
    points="256,182 334,256 256,330 178,256" 
    fill="rgba(12, 18, 36, 0.9)" 
    stroke="url(#cyberCyan)" 
    stroke-width="3" 
    stroke-linejoin="round"
  />

  <!-- Horizontal Laser Scanline Needle & Telemetry Marks -->
  <g stroke="url(#cyberCyan)" stroke-width="1.5" opacity="0.8">
    <path d="M 112 256 L 178 256" />
    <path d="M 334 256 L 400 256" />
    <!-- Tech Crosshair Ticks -->
    <path d="M 130 250 L 130 262" />
    <path d="M 146 252 L 146 260" />
    <path d="M 382 250 L 382 262" />
    <path d="M 366 252 L 366 260" />
  </g>

  <!-- Inner Faceted Sentinel Prism (Diamond Core) -->
  <polygon 
    points="256,204 308,256 256,308 204,256" 
    fill="url(#shieldViolet)" 
    fill-opacity="0.35" 
    stroke="#c084fc" 
    stroke-width="2" 
    stroke-linejoin="round"
  />

  <!-- Sharp Inner Aperture Core -->
  <polygon 
    points="256,224 288,256 256,288 224,256" 
    fill="#080e1e" 
    stroke="#00f0ff" 
    stroke-width="2.5" 
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- The Blazing Sentinel Pupil / Central Singularity -->
  <polygon 
    points="256,236 272,256 256,276 240,256" 
    fill="url(#pupilGlow)" 
    filter="url(#intenseBloom)"
  />

  <!-- Ultra-Bright Precision Core Point -->
  <circle cx="256" cy="256" r="4.5" fill="#ffffff" />
  <circle cx="256" cy="256" r="2" fill="#a5f3fc" />

  <!-- Micro Apex Pips (Cyber Eye Telemetry) -->
  <circle cx="256" cy="194" r="2" fill="#00f0ff" />
  <circle cx="256" cy="318" r="2" fill="#00f0ff" />
  <circle cx="192" cy="256" r="2" fill="#00f0ff" />
  <circle cx="320" cy="256" r="2" fill="#00f0ff" />
</svg>
